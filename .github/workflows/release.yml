name: Publish installable release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test and package
        run: |
          node scripts/build.mjs
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp 发布安装说明.md dist/INSTALL.md
          cd dist
          sha256sum MengxiEcho-4.2.5-agent.16.zip INSTALL.md > SHA256SUMS
          cp INSTALL.md release-notes.md
          if gh release view 'v4.2.5-agent.16' >/dev/null 2>&1; then
            echo 'Release already exists; preserving its assets.'
            exit 0
          fi
          gh release create 'v4.2.5-agent.16' 'MengxiEcho-4.2.5-agent.16.zip' INSTALL.md SHA256SUMS --target "$GITHUB_SHA" --title '梦溪·回声 v4.2.5-agent.16' --notes-file release-notes.md
